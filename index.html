<!DOCTYPE html>
<html lang="es" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B1810">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>CocoaCacao Costos</title>
<style>
:root{--bg:#F4F8FB;--grid:#CFDCE8;--ink:#2B1810;--card:#fff;--mut:#6B5A50;--acc:#B0124F;--on:#fff;--line:#2B1810;--ok:#1B7A43;color-scheme:light}
html[data-t=dark]{--bg:#1A120E;--grid:#2B1E18;--ink:#F6EDE6;--card:#261A15;--mut:#B9A596;--acc:#FF7AA5;--on:#1A120E;--line:#7A5A49;--ok:#6FD39A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:20px;margin:0}header span{font-size:13px;opacity:.75}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--line);padding:12px;margin:0 0 14px}
h2{font-size:17px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 8px}
input,select,textarea{width:100%;min-height:46px;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:3px}
textarea{min-height:120px}
button,.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;box-shadow:2px 2px 0 var(--line);margin:0 0 10px;cursor:pointer;text-align:center}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:none}
.pri{background:var(--acc);color:var(--on);border-color:var(--line)}
.x{width:auto;min-height:40px;padding:0 12px;font-size:13px;margin:0;box-shadow:none}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ir{display:grid;grid-template-columns:1fr 84px 14px 44px;gap:6px;align-items:center;margin-bottom:6px}
.ir input,.ir select{margin:0}
.big{font-size:22px;font-weight:800}.big small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.m{color:var(--mut);font-size:13px;margin:4px 0 10px}
.up{color:#C0392B}.dn{color:var(--ok)}
.ln{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.ln.t{font-weight:800;border-bottom:0;font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;z-index:6}
nav button{flex:1;min-height:54px;margin:0;background:transparent;color:var(--bg);border:0;box-shadow:none;font-size:12px;border-radius:10px}
nav button.on{background:var(--acc);color:var(--on)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.s{opacity:1}
img.pv{width:100%;border-radius:10px;border:2px solid var(--line);margin-top:8px}
</style>
</head>
<body>
<header><h1>CocoaCacao</h1><span id="h"></span></header>
<main id="app"></main>
<nav>
<button data-t="ins" onclick="go('ins')">Insumos</button>
<button data-t="scan" onclick="go('scan')">Escáner</button>
<button data-t="rec" onclick="go('rec')">Recetas</button>
<button data-t="pre" onclick="go('pre')">Precios</button>
<button data-t="cfg" onclick="go('cfg')">Ajustes</button>
</nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),K='cocoacacao_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{ins:[],rec:[],sel:'',cfg:{sueldo:3300,dias:24,hdia:8,fijos:0,mkt:0,lotes:20,gBs:22.5,gKg:10,gGh:200,com:3,m1:30,m2:40,theme:'auto'}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('No se pudo guardar: sin espacio')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const f=(n,d=2)=>(+n||0).toLocaleString('es-BO',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const ppg=i=>i.q>0?i.p/i.q:0;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');setTimeout(()=>e.classList.remove('s'),2200)}
function applyTheme(){const t=S.cfg.theme||'auto';const d=t=='dark'||(t=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.t=d?'dark':'light'}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

/* ---------- Costeo por absorción ---------- */
function cost(r){
 const c=S.cfg,pi=id=>S.ins.find(i=>i.id===id);
 const peso=r.it.reduce((a,x)=>a+num(x.g),0);
 const mp=r.it.reduce((a,x)=>{const i=pi(x.i);return a+(i?num(x.g)*ppg(i):0)},0);
 const por=Math.max(1,num(r.por));
 const env=num(r.env)*por;
 const mo=c.sueldo/(c.dias*c.hdia*60)*num(r.min);
 const gas=num(r.gas)/60*c.gGh*(c.gBs/(c.gKg*1000));
 const ind=(num(c.fijos)+num(c.mkt))/Math.max(1,c.lotes);
 const total=mp+env+mo+gas+ind;
 return{peso,mp,env,mo,gas,ind,total,por,unit:total/por,gpp:peso/por};
}
const price=(unit,m)=>{const co=unit*S.cfg.com/100;return(unit+co)/(1-m/100)};

/* ---------- Navegación ---------- */
let tab='ins',ed=null,scan={rows:[],text:'',info:'',img:'',name:''};
const T={ins:['Inventario',insV],scan:['Escáner de recetas',scanV],rec:['Recetas y costeo',recV],pre:['Precios de venta',preV],cfg:['Ajustes',cfgV]};
function go(t){tab=t;ed=null;R(1)}
function R(top){const y=scrollY;applyTheme();$('#h').textContent=T[tab][0];$('#app').innerHTML=T[tab][1]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));scrollTo(0,top?0:y)}
const cf=(k,l)=>`<label>${l}<input inputmode="decimal" value="${S.cfg[k]}" onchange="setC('${k}',this.value)"></label>`;
const setC=(k,v)=>{S.cfg[k]=num(v);save();R()};

/* ---------- Módulo 1: Inventario ---------- */
function insV(){
 const L=[...S.ins].sort((a,b)=>a.n.localeCompare(b.n,'es'));
 return `<div class="card"><h2>Nuevo insumo</h2>
 <label>Nombre<input id="an" placeholder="Harina de trigo"></label>
 <div class="r3"><label>Precio (Bs)<input id="ap" inputmode="decimal"></label><label>Cantidad<input id="aq" inputmode="decimal"></label><label>Unidad<select id="au"><option>g</option><option>ml</option></select></label></div>
 <button class="pri" onclick="addI()">Guardar insumo</button>
 <p class="m">Piezas como huevos: anota el peso total del cartón en gramos.</p></div>`+
 (L.map(i=>{const v=i.prev&&i.prev!=i.p?(i.p/i.prev-1)*100:0;
 return `<div class="card"><div class="rw"><b>${esc(i.n)}</b><button class="x" onclick="del('ins','${i.id}')">Borrar</button></div>
 <div class="r3"><label>Precio Bs<input inputmode="decimal" value="${i.p}" onchange="updI('${i.id}','p',this.value)"></label>
 <label>Cantidad ${i.u}<input inputmode="decimal" value="${i.q}" onchange="updI('${i.id}','q',this.value)"></label>
 <div class="big">Bs ${f(ppg(i),4)}<small>por ${i.u}${v?` <span class="${v>0?'up':'dn'}">${v>0?'▲':'▼'} ${f(Math.abs(v),1)}%</span>`:''}</small></div></div></div>`}).join('')||'<p class="m">Aún no hay insumos. Agrega el primero arriba.</p>');
}
function addI(){const n=$('#an').value.trim(),p=num($('#ap').value),q=num($('#aq').value);
 if(!n||q<=0){toast('Falta nombre o cantidad');return}
 S.ins.push({id:uid(),n,p,q,u:$('#au').value});save();R();toast('Insumo guardado')}
function updI(id,k,v){const i=S.ins.find(x=>x.id===id);v=num(v);if(k=='p'&&v!=i.p)i.prev=i.p;i[k]=v;save();R()}
function del(t,id){if(!confirm('¿Borrar?'))return;S[t]=S[t].filter(x=>x.id!==id);if(t=='rec'){ed=null;if(S.sel===id)S.sel=''}save();R(1)}

/* ---------- Módulo 2: Escáner ---------- */
function scanV(){
 return `<div class="card"><h2>Fotografiar receta</h2>
 <label class="btn pri">Abrir cámara<input type="file" accept="image/*" capture="environment" hidden onchange="doScan(this.files[0])"></label>
 <label class="btn">Elegir de la galería<input type="file" accept="image/*" hidden onchange="doScan(this.files[0])"></label>
 <p id="st" class="m">Buena luz, hoja plana y letra clara mejoran la lectura.</p>
 ${scan.img?`<img class="pv" src="${scan.img}" alt="Receta">`:''}</div>
 <div class="card"><h2>Texto reconocido</h2>
 <textarea id="tx" placeholder="Pega o escribe: 250 g harina&#10;200 g azúcar&#10;Hornear 180 °C 45 min" oninput="scan.text=this.value">${esc(scan.text)}</textarea>
 <button onclick="anal()">Extraer ingredientes</button></div>`+
 (scan.rows.length?`<div class="card"><h2>Ingredientes detectados</h2>
 <label>Nombre de la receta<input value="${esc(scan.name)}" onchange="scan.name=this.value"></label>
 ${scan.rows.map((r,k)=>`<div class="card" style="box-shadow:none;margin-bottom:8px"><label>Ingrediente<input value="${esc(r.n)}" onchange="scRow(${k},'n',this.value)"></label>
 <div class="r2"><label>Cantidad (g)<input inputmode="decimal" value="${r.g}" onchange="scRow(${k},'g',this.value)"></label>
 <label>Insumo<select onchange="scan.rows[${k}].i=this.value"><option value="">Crear nuevo</option>${S.ins.map(i=>`<option value="${i.id}" ${i.id==r.i?'selected':''}>${esc(i.n)}</option>`).join('')}</select></label></div>
 <button class="x" onclick="scan.rows.splice(${k},1);R()">Quitar</button></div>`).join('')}
 ${scan.info?`<p class="m">${esc(scan.info)}</p>`:''}
 <button class="pri" onclick="saveScan()">Crear receta</button></div>`:'');
}
async function prep(file){const b=await createImageBitmap(file),k=Math.min(1,1800/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/png'))}
async function doScan(file){
 if(!file)return;scan.img=URL.createObjectURL(file);R();const st=t=>{const e=$('#st');if(e)e.textContent=t};
 try{
  st('Preparando imagen…');const blob=await prep(file);
  if(!window.Tesseract){st('Cargando motor OCR (solo la primera vez)…');
   await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
  const r=await Tesseract.recognize(blob,'spa',{logger:m=>st(m.status+' '+Math.round((m.progress||0)*100)+'%')});
  scan.text=r.data.text;R();toast('Texto leído: revísalo y corrige');
 }catch(e){st('No se pudo leer la foto. El OCR necesita internet la primera vez; mientras tanto escribe o pega el texto abajo.')}
}
function parse(t){
 const rows=[],temp=[],mins=[],U='(kg|kilos?|gr?s?|gramos?|ml|lt|l|litros?)';
 t.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  (l.match(/\d{2,3}\s*(?:°|º|grados)/gi)||[]).forEach(x=>temp.push(parseInt(x)));
  (l.match(/\d+\s*(?:min|minutos)\b/gi)||[]).forEach(x=>mins.push(parseInt(x)));
  let m=l.match(new RegExp('^[-•*\\s]*(\\d+(?:[.,]\\d+)?)\\s*'+U+'\\b\\.?\\s*(?:de\\s+)?(.+)$','i')),n,q,u;
  if(m){q=m[1];u=m[2];n=m[3]}else{m=l.match(new RegExp('^[-•*\\s]*(.+?)[:\\s.]+(\\d+(?:[.,]\\d+)?)\\s*'+U+'\\b','i'));if(m){n=m[1];q=m[2];u=m[3]}}
  if(!m)return;q=num(q);u=u.toLowerCase();if(/^(kg|kilo|l$|lt|litro)/.test(u))q*=1000;
  rows.push({n:n.replace(/[.,;:]+$/,'').trim(),g:q,i:mt(n)});
 });
 return{rows,temp,mins};
}
const mt=n=>{const a=norm(n);const i=S.ins.find(i=>{const b=norm(i.n);return b&&(a.includes(b)||b.includes(a))});return i?i.id:''};
function anal(){const r=parse(scan.text);scan.rows=r.rows;
 scan.info=[r.temp.length?'Temperatura: '+[...new Set(r.temp)].join(', ')+' °C':'',r.mins.length?'Tiempos: '+r.mins.join(', ')+' min':''].filter(Boolean).join('. ');
 if(!r.rows.length)toast('No encontré ingredientes con gramos. Corrige el texto.');R()}
function scRow(k,c,v){const r=scan.rows[k];if(c=='g')r.g=num(v);else{r.n=v;r.i=mt(v)}R()}
function saveScan(){
 const it=[];scan.rows.filter(r=>r.g>0).forEach(r=>{let id=r.i;
  if(!id){id=uid();S.ins.push({id,n:r.n,p:0,q:1000,u:'g'})}it.push({i:id,g:r.g})});
 if(!it.length){toast('Sin ingredientes');return}
 const id=uid();S.rec.push({id,n:scan.name||'Receta escaneada',it,por:1,env:0,min:0,gas:0,proc:scan.info});
 save();scan={rows:[],text:'',info:'',img:'',name:''};tab='rec';ed=id;R(1);toast('Receta creada. Completa los precios de los insumos nuevos.')}

/* ---------- Módulo 3: Recetas y costeo ---------- */
function recV(){
 if(ed){const r=S.rec.find(x=>x.id===ed);if(r)return editV(r);ed=null}
 return `<button class="pri" onclick="newR()">Nueva receta</button>`+(S.rec.map(r=>{const c=cost(r);
 return `<div class="card" onclick="ed='${r.id}';R(1)"><div class="rw"><b>${esc(r.n)}</b><span class="big">Bs ${f(c.unit)}</span></div><p class="m">${f(c.peso,0)} g por lote, ${f(c.por,0)} porciones de ${f(c.gpp,0)} g</p></div>`}).join('')||'<p class="m">Crea una receta o fotografíala en Escáner.</p>');
}
function newR(){const id=uid();S.rec.push({id,n:'Nueva receta',it:[],por:1,env:0,min:0,gas:0,proc:''});save();ed=id;R(1)}
function editV(r){
 const c=cost(r),o=sel=>`<option value="">Elegir insumo</option>`+S.ins.map(i=>`<option value="${i.id}" ${i.id==sel?'selected':''}>${esc(i.n)}</option>`).join('');
 const rf=(k,l)=>`<label>${l}<input inputmode="decimal" value="${r[k]}" onchange="updR('${r.id}','${k}',this.value)"></label>`;
 return `<button onclick="ed=null;R(1)">Volver a recetas</button>
 <div class="card"><label>Nombre<input value="${esc(r.n)}" onchange="updR('${r.id}','n',this.value,1)"></label>
 <h2>Ingredientes (g)</h2>
 ${r.it.map((x,k)=>`<div class="ir"><select onchange="setIt('${r.id}',${k},'i',this.value)">${o(x.i)}</select><input inputmode="decimal" value="${x.g}" onchange="setIt('${r.id}',${k},'g',this.value)"><span>g</span><button class="x" onclick="rmIt('${r.id}',${k})">✕</button></div>`).join('')}
 <button onclick="addIt('${r.id}')">Agregar ingrediente</button>
 <p class="m">Rendimiento total del lote: <b>${f(c.peso,0)} g</b></p></div>
 <div class="card"><h2>Costos del lote</h2>
 <div class="r2">${rf('por','Porciones por lote')}${rf('env','Envase por porción (Bs)')}${rf('min','Mano de obra (min)')}${rf('gas','Hornalla encendida (min)')}</div></div>
 <div class="card"><h2>Costeo por absorción</h2>
 <div class="ln"><span>Materia prima</span><span>Bs ${f(c.mp)}</span></div>
 <div class="ln"><span>Envases</span><span>Bs ${f(c.env)}</span></div>
 <div class="ln"><span>Mano de obra</span><span>Bs ${f(c.mo)}</span></div>
 <div class="ln"><span>Gas de hornalla</span><span>Bs ${f(c.gas)}</span></div>
 <div class="ln"><span>Gastos fijos y marketing</span><span>Bs ${f(c.ind)}</span></div>
 <div class="ln t"><span>Costo del lote</span><span>Bs ${f(c.total)}</span></div>
 <div class="ln t"><span>Costo por porción</span><span>Bs ${f(c.unit)}</span></div></div>
 <div class="card"><label>Procedimiento (°C y min)<textarea onchange="updR('${r.id}','proc',this.value,1)">${esc(r.proc||'')}</textarea></label></div>
 <button class="pri" onclick="S.sel='${r.id}';save();go('pre')">Ver precios de venta</button>
 <button onclick="del('rec','${r.id}')">Borrar receta</button>`;
}
const rec=id=>S.rec.find(r=>r.id===id);
function updR(id,k,v,txt){rec(id)[k]=txt?v:num(v);save();R()}
function setIt(id,k,c,v){rec(id).it[k][c]=c=='g'?num(v):v;save();R()}
function addIt(id){rec(id).it.push({i:'',g:0});save();R()}
function rmIt(id,k){rec(id).it.splice(k,1);save();R()}

/* ---------- Módulo 4: Precios ---------- */
function preV(){
 if(!S.rec.length)return '<p class="m">Primero crea una receta.</p>';
 const r=rec(S.sel)||S.rec[0],c=cost(r),b=c.unit*(1+S.cfg.com/100);
 const card=m=>{const p=price(c.unit,m);return `<div class="card"><div class="rw"><span>Margen neto ${f(m,0)}%</span><span class="big">Bs ${f(p)}</span></div>
 <div class="ln"><span>Ganancia por porción</span><span>Bs ${f(p-b)}</span></div>
 <div class="ln"><span>Ganancia por lote</span><span>Bs ${f((p-b)*c.por)}</span></div></div>`};
 return `<div class="card"><label>Receta<select onchange="S.sel=this.value;save();R()">${S.rec.map(x=>`<option value="${x.id}" ${x.id==r.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select></label>
 <div class="big">Bs ${f(c.unit)}<small>costo por porción (${f(c.gpp,0)} g). Con comisión de pago ${f(S.cfg.com,1)}%: Bs ${f(b)}</small></div></div>
 <div class="r2">${cf('m1','Margen 1 (%)')}${cf('m2','Margen 2 (%)')}</div>${card(S.cfg.m1)}${card(S.cfg.m2)}
 <p class="m">Precio = (costo + comisión) ÷ (1 − margen neto).</p>`;
}

/* ---------- Ajustes y respaldo ---------- */
function cfgV(){
 return `<div class="card"><h2>Apariencia</h2><label>Tema<select onchange="S.cfg.theme=this.value;save();R()">${[['auto','Automático'],['light','Claro'],['dark','Oscuro']].map(t=>`<option value="${t[0]}" ${S.cfg.theme==t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></label></div>
 <div class="card"><h2>Mano de obra</h2><div class="r3">${cf('sueldo','Sueldo mensual (Bs)')}${cf('dias','Días al mes')}${cf('hdia','Horas al día')}</div></div>
 <div class="card"><h2>Gas (garrafa)</h2><div class="r3">${cf('gBs','Precio garrafa (Bs)')}${cf('gKg','Peso gas (kg)')}${cf('gGh','Consumo hornalla (g/h)')}</div></div>
 <div class="card"><h2>Gastos indirectos</h2><div class="r3">${cf('fijos','Fijos al mes (Bs)')}${cf('mkt','Marketing al mes (Bs)')}${cf('lotes','Lotes al mes')}</div>
 <p class="m">Se reparten entre los lotes del mes. Revisa el consumo de la hornalla con tu uso real.</p></div>
 <div class="card"><h2>Pagos</h2>${cf('com','Comisión QR y billeteras (%)')}</div>
 <div class="card"><h2>Respaldo de datos</h2><button onclick="exp()">Exportar copia (.json)</button>
 <label class="btn">Importar copia<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label>
 <p class="m">Haz una copia cada semana: si borras los datos del navegador o desinstalas, se pierden.</p></div>`;
}
